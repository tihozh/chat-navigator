<svg xmlns="http://www.w3.org/2000/svg" width="480" height="44" viewBox="0 0 480 44" role="img" aria-label="Status bar with the crab running while one chat is waiting">
  <style>
    .bg { fill: #f6f6f4; stroke: #dcdcd8; }
    .cover { fill: #f6f6f4; }
    .ink { fill: #1f1f1d; }
    .muted { fill: #888780; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #262624; stroke: #3a3a37; }
      .cover { fill: #262624; }
      .ink { fill: #ececea; }
      .muted { fill: #9c9b95; }
    }
    .crab { animation: run 7.2s steps(12) infinite alternate; }
    @keyframes run { from { transform: translateX(0); } to { transform: translateX(132px); } }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="479" height="43" rx="10"/>
  <text class="muted" x="18" y="27" font-size="13">chat-navigator</text>
  <text class="muted" x="122" y="27" font-size="13" letter-spacing="1">····························</text>
  <g class="crab">
    <rect class="cover" x="122" y="12" width="40" height="22"/>
    <text class="ink" x="124" y="28" font-size="15">🦀 1</text>
  </g>
  <text class="ink" x="330" y="27" font-size="13" font-weight="600">Opus</text>
  <text class="muted" x="372" y="27" font-size="13">Medium</text>
  <text class="ink" x="430" y="27" font-size="13">Auto</text>
</svg>
