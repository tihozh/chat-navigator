<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="Chat Navigator pane next to a chat">
  <style>
    .bg { fill: #ffffff; }
    .frame { fill: #f6f6f4; stroke: #dcdcd8; }
    .panebg { fill: #ffffff; stroke: #dcdcd8; }
    .ink { fill: #1f1f1d; }
    .muted { fill: #888780; }
    .line { stroke: #e3e3df; }
    .bubble { fill: #ececea; }
    .bar { fill: #dcdcd8; }
    .card { fill: rgba(128,128,128,0.08); }
    .prompt { fill: #ffffff; stroke: #d6d6d2; }
    .band { fill: #ededeb; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1e1e1c; }
      .frame { fill: #262624; stroke: #3a3a37; }
      .panebg { fill: #1e1e1c; stroke: #3a3a37; }
      .ink { fill: #ececea; }
      .muted { fill: #9c9b95; }
      .line { stroke: #3a3a37; }
      .bubble { fill: #30302d; }
      .bar { fill: #3a3a37; }
      .card { fill: rgba(128,128,128,0.14); }
      .prompt { fill: #262624; stroke: #45453f; }
      .band { fill: #2c2c29; }
    }
  </style>

  <!-- Window -->
